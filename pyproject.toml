[project]
name = "bc-rag-context"
version = "0.2.0"
description = "bc-rag-context: local hybrid retrieval. Binary nickname: bc-rag."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bc-rag-context" }]
keywords = ["rag", "qdrant", "embeddings", "typescript", "markdown"]
dependencies = [
    "fastembed>=0.7.0",
    "mcp>=2.2.0",
    "openapi-core>=0.19.0",
    "openapi-markdown>=0.4.3",
    "pathspec>=0.12.0",
    "prance>=26.7.19.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "qdrant-client>=1.15.0",
    "rich>=13.9.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.9.0",
    "typer>=0.15.0",
    "watchdog>=6.0.0",
    "wcmatch>=10.0",
]

[project.scripts]
bc-rag = "bc_rag.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets tests import `tests.support` under a plain `pytest` run.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
